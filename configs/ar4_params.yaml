# AR4 Robot Parameter Configuration
# This file defines all tunable environment parameters for the AR4 6-DOF manipulator

robot:
  name: "AR4"
  dof: 6
  
# Joint parameters (per joint, 6 total)
joints:
  # Joint names
  names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
  
  # Default values from AR4 MuJoCo model
  defaults:
    armature: 0.1
    damping: -10.0  # Note: negative due to MuJoCo convention
    frictionloss: 0.1
    
  # Tunable ranges for domain randomization
  ranges:
    armature:
      low: 0.01
      high: 0.5
    damping:
      low: -20.0
      high: -2.0
    frictionloss:
      low: 0.01
      high: 0.5

# Link inertia parameters (per link, 6 total)
links:
  names: ["base_link", "link_1", "link_2", "link_3", "link_4", "link_5", "link_6"]
  
  # Inertia scaling factors (multiply original values)
  ranges:
    mass_scale:
      low: 0.8
      high: 1.2
    inertia_scale:
      low: 0.8
      high: 1.2

# Actuator parameters
actuators:
  # Force/torque limits
  defaults:
    forcerange: [-25.0, 25.0]
    
  ranges:
    force_scale:
      low: 0.8
      high: 1.2
    ctrl_delay:
      low: 0.0
      high: 0.05  # seconds

# Contact parameters (for gripper and object interaction)
contact:
  defaults:
    friction_sliding: 0.8
    friction_torsional: 0.02
    friction_rolling: 0.01
    
  ranges:
    friction_sliding:
      low: 0.3
      high: 1.5
    friction_torsional:
      low: 0.005
      high: 0.1
    friction_rolling:
      low: 0.001
      high: 0.05

# Gripper parameters (if using gripper)
gripper:
  defaults:
    stiffness: 100.0
    damping: 10.0
    
  ranges:
    stiffness:
      low: 50.0
      high: 200.0
    damping:
      low: 5.0
      high: 30.0

# Sensing/Observation parameters
sensing:
  defaults:
    position_noise: 0.0
    velocity_noise: 0.0
    
  ranges:
    position_noise:
      low: 0.0
      high: 0.01  # meters
    velocity_noise:
      low: 0.0
      high: 0.1  # m/s

# Camera parameters (for vision-based tasks)
camera:
  defaults:
    bias_x: 0.0
    bias_y: 0.0
    bias_z: 0.0
    
  ranges:
    bias_x:
      low: -0.05
      high: 0.05
    bias_y:
      low: -0.05
      high: 0.05
    bias_z:
      low: -0.02
      high: 0.02

# Full parameter list with indices
parameter_list:
  # Joint parameters (0-17)
  - name: "joint_1@damping"
    index: 0
    category: "joint"
  - name: "joint_2@damping"
    index: 1
    category: "joint"
  - name: "joint_3@damping"
    index: 2
    category: "joint"
  - name: "joint_4@damping"
    index: 3
    category: "joint"
  - name: "joint_5@damping"
    index: 4
    category: "joint"
  - name: "joint_6@damping"
    index: 5
    category: "joint"
  - name: "joint_1@frictionloss"
    index: 6
    category: "joint"
  - name: "joint_2@frictionloss"
    index: 7
    category: "joint"
  - name: "joint_3@frictionloss"
    index: 8
    category: "joint"
  - name: "joint_4@frictionloss"
    index: 9
    category: "joint"
  - name: "joint_5@frictionloss"
    index: 10
    category: "joint"
  - name: "joint_6@frictionloss"
    index: 11
    category: "joint"
  - name: "joint_1@armature"
    index: 12
    category: "joint"
  - name: "joint_2@armature"
    index: 13
    category: "joint"
  - name: "joint_3@armature"
    index: 14
    category: "joint"
  - name: "joint_4@armature"
    index: 15
    category: "joint"
  - name: "joint_5@armature"
    index: 16
    category: "joint"
  - name: "joint_6@armature"
    index: 17
    category: "joint"
    
  # Link inertia parameters (18-31)
  - name: "link_1@mass"
    index: 18
    category: "inertia"
  - name: "link_2@mass"
    index: 19
    category: "inertia"
  - name: "link_3@mass"
    index: 20
    category: "inertia"
  - name: "link_4@mass"
    index: 21
    category: "inertia"
  - name: "link_5@mass"
    index: 22
    category: "inertia"
  - name: "link_6@mass"
    index: 23
    category: "inertia"
    
  # Contact parameters (24-29)
  - name: "contact@friction_sliding"
    index: 24
    category: "contact"
  - name: "contact@friction_torsional"
    index: 25
    category: "contact"
  - name: "contact@friction_rolling"
    index: 26
    category: "contact"
  - name: "gripper@friction_sliding"
    index: 27
    category: "contact"
  - name: "gripper@stiffness"
    index: 28
    category: "gripper"
  - name: "gripper@damping"
    index: 29
    category: "gripper"
    
  # Actuator parameters (30-35)
  - name: "actuator_1@force_scale"
    index: 30
    category: "actuator"
  - name: "actuator_2@force_scale"
    index: 31
    category: "actuator"
  - name: "actuator_3@force_scale"
    index: 32
    category: "actuator"
  - name: "actuator_4@force_scale"
