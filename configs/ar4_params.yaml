  - name: "sensing@velocity_noise"
    index: 37
    category: "sensing"
  - name: "camera@bias_x"
    index: 38
    category: "camera"
  - name: "camera@bias_y"
    index: 39
    category: "camera"

# Trajectory difference components (K)
trajectory_components:
  # End-effector pose
  - name: "ee_pos_x"
    index: 0
  - name: "ee_pos_y"
    index: 1
  - name: "ee_pos_z"
    index: 2
  - name: "ee_rot_x"
    index: 3
  - name: "ee_rot_y"
    index: 4
  - name: "ee_rot_z"
    index: 5
    
# Task phases for temporal model
task_phases:
  - name: "approach"
    description: "Free space motion toward object"
    relevant_params: ["joint@damping", "link@mass", "actuator@force_scale"]
  - name: "grasp"
    description: "Contact and grasping"
    relevant_params: ["contact@friction", "gripper@stiffness"]
  - name: "lift"
    description: "Lifting with payload"
    relevant_params: ["link@mass", "actuator@force_scale"]
  - name: "place"
    description: "Placing and releasing"
    relevant_params: ["contact@friction", "gripper@damping"]
